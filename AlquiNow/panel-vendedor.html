<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Propiedad - AlquiNow</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header>
    <a href="./index.html" class="logo">AlquiNow</a>
    <nav>
        <a href="./index.html" class="nav-btn active">Buscar</a>
        <a href="./panel-vendedor.html" class="nav-btn">Publicar</a>
        <a href="./reservar.html" class="nav-btn">Mis Reservas</a>
        <a href="./registro.html" class="nav-btn">Mi Perfil</a>
    </nav>
</header>

    <main>
        <section class="section active">
            <h2>Publicar Nueva Propiedad</h2>
            <form id="publish-form" action="propiedades" method="post" enctype="multipart/form-data">
                
                <h3>Ubicación</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="calle">Calle</label>
                        <input type="text" id="calle" name="calle" required>
                    </div>
                    <div class="form-group">
                        <label for="altura">Altura</label>
                        <input type="number" id="altura" name="altura" required>
                    </div>
                    <div class="form-group">
                        <label for="piso">Piso (Opcional)</label>
                        <input type="number" id="piso" name="piso">
                    </div>
                    <div class="form-group">
                        <label for="cp">Código Postal</label>
                        <input type="text" id="cp" name="cp" required>
                    </div>
                    <div class="form-group">
                        <label for="ciudad">Ciudad</label>
                        <input type="text" id="ciudad" name="ciudad" value="Bahía Blanca" required>
                    </div>
                    <div class="form-group">
                        <label for="provincia">Provincia</label>
                        <select id="provincia" name="provincia" required>
                            <option value="Buenos Aires">Buenos Aires</option>
                            <option value="CABA">CABA</option>
                            <option value="Córdoba">Córdoba</option>
                            <option value="Santa Fe">Santa Fe</option>
                            <option value="Mendoza">Mendoza</option>
                            <option value="Neuquén">Neuquén</option>
                            <option value="Río Negro">Río Negro</option>
                        </select>
                    </div>
                </div>

                <h3>Características del Inmueble</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="cant_personas">Cant. Personas</label>
                        <input type="number" id="cant_personas" name="cant_personas" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="metros_cuadrados">Metros Cuadrados (m²)</label>
                        <input type="number" id="metros_cuadrados" name="metros_cuadrados" required>
                    </div>
                    <div class="form-group">
                        <label for="precio_por_noche">Precio por Noche ($)</label>
                        <input type="number" id="precio_por_noche" name="precio_por_noche" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="estadia_minima">Estadía Mínima (Días)</label>
                        <input type="number" id="estadia_minima" name="estadia_minima" min="1" required>
                    </div>
                </div>

                <h3>Fotos de la Propiedad</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fotos">Cargar Fotos (Múltiples)</label>
                        <input type="file" id="fotos" name="fotos" accept="image/*" multiple required>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label for="descripcion">Descripción detallada</label>
                    <textarea id="descripcion" name="descripcion" rows="3" required></textarea>
                </div>

                <button type="submit" class="btn" style="margin-top: 1.5rem;">Registrar Propiedad</button>
            </form>
        </section>
    </main>

    <footer>
        <p>AlquiNow - Sistema de Alquileres Temporales</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
