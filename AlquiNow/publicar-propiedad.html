<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Propiedad - AlquiNow</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">AlquiNow</a>
        <nav>
            <a href="index.html" class="nav-btn">Buscar</a>
            <a href="panel-vendedor.html" class="nav-btn active">Publicar</a>
            <a href="reservar.html" class="nav-btn">Mis Reservas</a>
            <a href="registro.html" class="nav-btn">Mi Perfil</a>
        </nav>
    </header>

    <main>
        <section class="section active">
            <h2>Subir Nueva Publicación</h2>
            <form id="form-subir-propiedad" action="propiedades" method="post" enctype="multipart/form-data">
                
                <h3>Información Básica</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="titulo">Título de la Publicación</label>
                        <input type="text" id="titulo" name="titulo" placeholder="Ej: Depto Luminoso Frente al Mar" required>
                    </div>
                    <div class="form-group">
                        <label for="tipo_propiedad">Tipo de Inmueble</label>
                        <select id="tipo_propiedad" name="tipo_propiedad" required>
                            <option value="departamento">Departamento</option>
                            <option value="casa">Casa</option>
                            <option value="cabana">Cabaña</option>
                            <option value="ph">PH</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="precio_noche">Precio por Noche ($)</label>
                        <input type="number" id="precio_noche" name="precio_noche" step="0.01" placeholder="25000" required>
                    </div>
                </div>

                <h3>Ubicación</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="ciudad">Ciudad</label>
                        <input type="text" id="ciudad" name="ciudad" value="Bahía Blanca" required>
                    </div>
                    <div class="form-group">
                        <label for="direccion">Dirección / Calle y Altura</label>
                        <input type="text" id="direccion" name="direccion" placeholder="Ej: Av. Alem 1234" required>
                    </div>
                </div>

                <h3>Capacidad y Servicios</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="capacidad">Huéspedes Máximos</label>
                        <input type="number" id="capacidad" name="capacidad" min="1" value="2" required>
                    </div>
                    <div class="form-group">
                        <label for="ambientes">Cantidad de Ambientes</label>
                        <input type="number" id="ambientes" name="ambientes" min="1" value="1" required>
                    </div>
                    <div class="form-group">
                        <label for="estadia_min">Estadía Mínima (Noches)</label>
                        <input type="number" id="estadia_min" name="estadia_min" min="1" value="2" required>
                    </div>
                </div>

                <h3>Galería de Imágenes</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="imagenes">Subir Fotos de la Propiedad</label>
                        <input type="file" id="imagenes" name="imagenes" accept="image/*" multiple required>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label for="descripcion_corta">Descripción de la Propiedad</label>
                    <textarea id="descripcion_corta" name="descripcion" rows="4" placeholder="Describí las comodidades, cercanía a transporte, equipamiento, etc." required></textarea>
                </div>

                <button type="submit" class="btn" style="margin-top: 1.5rem; width: 100%;">Publicar Propiedad</button>
            </form>
        </section>
    </main>

    <footer>
        <p>AlquiNow - Sistema de Alquileres Temporales</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
