<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - AlquiNow</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header>
    <a href="./index.html" class="logo">AlquiNow</a>
    <nav>
        <a href="./index.html" class="nav-btn active">Buscar</a>
        <a href="./panel-vendedor.html" class="nav-btn">Publicar</a>
        <a href="./reservar.html" class="nav-btn">Mis Reservas</a>
        <a href="./registro.html" class="nav-btn">Mi Perfil</a>
    </nav>
</header>

    <main>
        <section class="section active">
            <h2>Registro / Configuración de Usuario</h2>
            <form id="register-form" action="registro" method="post">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Mail</label>
                        <input type="email" name="mail" placeholder="ejemplo@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" name="contrasena" required>
                    </div>
                    <div class="form-group">
                        <label>DNI</label>
                        <input type="text" name="dni" required>
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" name="tel" required>
                    </div>
                    <div class="form-group">
                        <label>Rol de Usuario</label>
                        <div class="role-input-box">
                            <label><input type="checkbox" id="chk-comprador" onchange="toggleRoleFields()" checked> Comprador</label>
                            <label><input type="checkbox" id="chk-vendedor" onchange="toggleRoleFields()"> Vendedor</label>
                        </div>
                    </div>
                </div>

                <div id="comprador-fields" style="background: var(--light); padding: 1rem; margin-top: 1rem; border-radius: 4px;">
                    <h3>Datos del Comprador</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Método de Pago Preferido</label>
                            <select name="metodo_pago">
                                <option>Transferencia Bancaria</option>
                                <option>Tarjeta de Crédito</option>
                                <option>Efectivo</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Preferencias de Búsqueda</label>
                            <input type="text" name="preferencias" placeholder="Ej: Bahía Blanca, 2 personas">
                        </div>
                    </div>
                </div>

                <div id="vendedor-fields" style="display: none; background: var(--light); padding: 1rem; margin-top: 1rem; border-radius: 4px;">
                    <h3>Datos del Vendedor</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>CBU / CVU</label>
                            <input type="text" name="cbu" placeholder="Para recibir transferencias de señas">
                        </div>
                        <div class="form-group">
                            <label>Tipo de Vendedor</label>
                            <select name="tipo_vendedor">
                                <option>Particular / Dueño Directo</option>
                                <option>Inmobiliaria</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Foto de Perfil / Logo</label>
                            <input type="file" name="foto" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>Matrícula / Doc. Comercial (Opcional)</label>
                            <input type="file" name="doc" accept="image/*,.pdf">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn" style="margin-top: 1.5rem;">Registrar Usuario</button>
            </form>
        </section>
    </main>

    <footer>
        <p>AlquiNow - Sistema de Alquileres Temporales</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
