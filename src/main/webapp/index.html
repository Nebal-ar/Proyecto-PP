<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AlquiNow — Alquileres temporales</title>
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body>

        <header class="nav">
            <div class="logo">Alqui<span>Now</span></div>
            <nav class="nav-links">
                <a href="index.html">Buscar</a>
                <a href="login.html">Ingresar</a>
                <a href="registro.html">Crear cuenta</a>
            </nav>
        </header>

        <section class="hero">
            <h1>Tu próxima estadía, <span>a un clic</span></h1>
            <p>Encontrá departamentos y casas para alquilar por noche en toda Argentina.</p>
        </section>

        <main class="contenedor">

            <!-- Filtros de búsqueda -->
            <div class="filtros">
                <div class="campo">
                    <label for="f-ciudad">Ciudad</label>
                    <input type="text" id="f-ciudad" placeholder="Ej: Neuquén">
                </div>
                <div class="campo">
                    <label for="f-provincia">Provincia</label>
                    <select name="provincia" id="provincia">
                        <option value="">Todas las provincias</option>
                        <option value="Buenos Aires">Buenos Aires</option>
                        <option value="CABA">Ciudad Autónoma de Buenos Aires</option>
                        <option value="Catamarca">Catamarca</option>
                        <option value="Chaco">Chaco</option>
                        <option value="Chubut">Chubut</option>
                        <option value="Córdoba">Córdoba</option>
                        <option value="Corrientes">Corrientes</option>
                        <option value="Entre Ríos">Entre Ríos</option>
                        <option value="Formosa">Formosa</option>
                        <option value="Jujuy">Jujuy</option>
                        <option value="La Pampa">La Pampa</option>
                        <option value="La Rioja">La Rioja</option>
                        <option value="Mendoza">Mendoza</option>
                        <option value="Misiones">Misiones</option>
                        <option value="Neuquén">Neuquén</option>
                        <option value="Río Negro">Río Negro</option>
                        <option value="Salta">Salta</option>
                        <option value="San Juan">San Juan</option>
                        <option value="San Luis">San Luis</option>
                        <option value="Santa Cruz">Santa Cruz</option>
                        <option value="Santa Fe">Santa Fe</option>
                        <option value="Santiago del Estero">Santiago del Estero</option>
                        <option value="Tierra del Fuego">Tierra del Fuego</option>
                        <option value="Tucumán">Tucumán</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="f-precio">Precio máx / noche</label>
                    <input type="number" id="f-precio" placeholder="$" min="1">
                </div>
                <div class="campo">
                    <label for="f-personas">Personas (mín)</label>
                    <input type="number" id="f-personas" placeholder="2" min="1">
                </div>
                <button class="btn" onclick="buscar()">Buscar</button>
            </div>

            <!-- Resultados -->
            <h2 style="margin-top: 2rem; margin-bottom: 1rem;">Propiedades destacadas</h2>

            <div id="resultados" class="grid" style="gap: 1.5rem;">
                <p>Cargando catálogo...</p>
            </div>
        </main> 

        <!-- Cargamos el detector de sesiones -->
        <script src="js/session.js?v=3"></script>

        <!-- Lógica para cargar el catálogo y el buscador dinámico -->
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                cargarPropiedades('propiedades');
            });

            // --- Lógica para cargar las propiedades en index.html ---
            function cargarPropiedades(url) {
              fetch(url)
                .then(response => response.json())
                .then(data => {
                  const contenedor = document.getElementById("resultados");
                  contenedor.innerHTML = "";

                  if (data.length === 0) {
                    contenedor.innerHTML = '<p style="color:var(--gris);">No se encontraron propiedades.</p>';
                    return;
                  }

                  data.forEach(prop => {
                    let pisoHTML = "";
                    if (prop.piso && prop.piso !== "0" && prop.piso.trim() !== "") {
                      pisoHTML = ` - ${prop.piso}`;
                    }

                    const tarjeta = document.createElement("div");
                    tarjeta.className = "propiedad-card";
                    
                    // Forzamos los estilos para recuperar el fondo blanco y que no parezca texto suelto
                    tarjeta.style.backgroundColor = "#ffffff";
                    tarjeta.style.borderRadius = "12px";
                    tarjeta.style.boxShadow = "0 4px 6px rgba(0,0,0,0.05)";
                    tarjeta.style.border = "1px solid #eaeaea";
                    tarjeta.style.overflow = "hidden";
                    tarjeta.style.display = "flex";
                    tarjeta.style.flexDirection = "column";

                    // Calculamos las estrellas (si no tiene, muestra "Sin reseñas")
                    const estrellasHTML = prop.promedioEstrellas > 0 
                        ? `⭐ ${prop.promedioEstrellas}` 
                        : `<span style="font-size:0.8rem; color:#999;">Sin reseñas</span>`;

                    tarjeta.innerHTML = `
                      <!-- Placeholder de imagen (Acá va a ir la galería de fotos) -->
                      <div class="imagen-placeholder" style="background-color: #f4f4f4; height: 160px; padding: 12px; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #eaeaea;">
                          <span class="badge" style="background-color: #d1e7dd; color: #0f5132; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.75rem;">Nuevo</span>
                          <button onclick="toggleFavorito(${prop.idPropiedad}, this)" class="btn-favorito" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; padding: 0;">🤍</button>
                      </div>
                      
                      <!-- Información de la propiedad -->
                      <div class="info" style="padding: 16px; display: flex; flex-direction: column; flex-grow: 1;">
                          
                          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                              <div class="ubicacion" style="color: #666; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">${prop.ciudad}, ${prop.provincia}</div>
                              <div class="estrellas" style="font-size: 0.9rem;">${estrellasHTML}</div>
                          </div>
                          
                          <h3 class="titulo" style="margin: 0 0 8px 0; font-size: 1.15rem; color: #222;">${prop.calle} ${prop.altura}${pisoHTML}</h3>
                          <div class="capacidad" style="font-size: 0.9rem; margin-bottom: 8px; color: #444;"><strong>Capacidad:</strong> ${prop.cantPersonas} personas</div>
                          
                          <p class="descripcion" style="font-size:0.9rem; color:#666; margin-bottom: 16px; flex-grow: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${prop.descripcion}</p>
                          
                          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-top: 16px; margin-top: auto;">
                              <div class="precio" style="font-weight: 900; font-size: 1.2rem; color: #111;">
                                  $${Number(prop.precioPorNoche).toLocaleString('es-AR')} <span style="font-size: 0.85rem; font-weight: normal; color: #666;">/ noche</span>
                              </div>
                              <button onclick="window.location.href='reservar.html?id=${prop.idPropiedad}'" style="background-color: #e55e30; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold;">
                                  Reservar
                              </button>
                          </div>
                      </div>
                    `;
                    contenedor.appendChild(tarjeta);
                  });
                })
                .catch(err => {
                  console.error("Error cargando propiedades:", err);
                  document.getElementById("resultados").innerHTML = '<p style="color:red;">Error al cargar datos.</p>';
                });
            }

            function buscar() {
                const ciudad = document.getElementById("f-ciudad").value.trim();
                const provincia = document.getElementById("f-provincia").value;
                const precio = document.getElementById("f-precio").value;
                const personas = document.getElementById("f-personas").value;

                const params = new URLSearchParams();
                if (ciudad) params.append("ciudad", ciudad);
                if (provincia && provincia !== "") params.append("provincia", provincia);
                if (precio) params.append("precioMax", precio);
                if (personas) params.append("personas", personas);

                const queryString = params.toString() ? '?' + params.toString() : '';
                cargarPropiedades('propiedades' + queryString);
            }

            function toggleFavorito(idPropiedad, btnElement) {
                const estadoActual = btnElement.getAttribute('data-estado');
                const accion = estadoActual === 'vacio' ? 'agregar' : 'eliminar';

                const params = new URLSearchParams();
                params.append('idPropiedad', idPropiedad);
                params.append('accion', accion);

                fetch('favorito', {
                    method: 'POST',
                    body: params
                })
                .then(response => {
                    if (response.status === 401) {
                        alert("Tenés que iniciar sesión para guardar favoritos.");
                        window.location.href = "login.html";
                        return null;
                    }
                    return response.text();
                })
                .then(texto => {
                    if (!texto) return;

                    if (texto.trim() === 'agregado') {
                        btnElement.innerText = '❤️';
                        btnElement.setAttribute('data-estado', 'lleno');
                    } else if (texto.trim() === 'eliminado') {
                        btnElement.innerText = '🤍';
                        btnElement.setAttribute('data-estado', 'vacio');
                    }
                })
                .catch(error => console.error("Error en favoritos:", error));
            }
        </script>
    </body>
</html>
