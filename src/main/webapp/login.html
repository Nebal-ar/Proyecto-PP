<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — AlquiNow</title>
  <link rel="stylesheet" href="css/estilos.css?v=6">
</head>
<body>

  <header class="nav">
    <div class="logo"><a href="index.html" style="text-decoration:none;color:inherit;">Alqui<span>Now</span></a></div>
    <nav class="nav-links">
      <a href="index.html">Buscar</a>
      <a href="registro.html">Crear cuenta</a>
    </nav>
  </header>

  <div class="form-box">
    <h1>Ingresá a tu cuenta</h1>
    <p class="sub">Bienvenido de nuevo.</p>

    <!-- Mensajes según el querystring -->
    <div id="msg"></div>
    
    <!-- Cartel de éxito (Oculto por defecto) -->
    <div id="alerta-exito" style="display: none; background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; font-weight: bold;"></div>

    <!-- El form envía POST al servlet /login -->
    <form action="login" method="post">
      <label for="mail">Mail</label>
      <input type="email" id="mail" name="mail" required>

      <div style="display: flex; justify-content: space-between; align-items: baseline; margin: 0.9rem 0 0.3rem;">
        <label for="contrasena" style="margin: 0;">Contraseña</label>
        <a href="recuperar.html" style="font-size: 0.85rem; color: var(--brasa); font-weight: 600; text-decoration: none;">¿Olvidaste tu contraseña?</a>
      </div>
      <input type="password" id="contrasena" name="contrasena" required>

      <button type="submit" class="btn btn-block">Ingresar</button>
    </form>

    <p style="text-align:center; margin-top: 1rem;">
      <a href="recuperar.html" style="color: var(--gris); font-size: 0.9rem; text-decoration: underline;">Recuperar contraseña con mi correo</a>
    </p>

    <p style="text-align:center; margin-top: 0.8rem; color:var(--gris);">
      ¿No tenés cuenta? <a href="registro.html" style="color:var(--brasa); font-weight: 600;">Registrate</a>
    </p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const msg = document.getElementById("msg");
    const exitoDiv = document.getElementById("alerta-exito");
    
    // Caso 1: Viene de registrarse
    if (params.get("registrado")) {
      msg.innerHTML = '<div class="alerta alerta-ok">¡Cuenta creada! Ya podés ingresar.</div>';
    }
    
    // Caso 2: Quiso entrar a una ruta protegida sin sesión
    if (params.get("required")) {
      msg.innerHTML = '<div class="alerta alerta-error">Necesitás iniciar sesión para ver esa página.</div>';
    }

    // Caso 3: Se equivocó de mail o contraseña
    if (params.get("error")) {
      msg.innerHTML = '<div class="alerta alerta-error">Mail o contraseña incorrectos.</div>';
      window.history.replaceState({}, document.title, "login.html");
    }

    // Caso 4: Activó la cuenta por correo
    if (params.has("verificado")) {
      exitoDiv.style.display = "block";
      exitoDiv.innerText = "¡Tu cuenta fue activada con éxito! Ya podés ingresar.";
    }

    // Caso 5: Restableció su contraseña con éxito
    if (params.has("recuperado")) {
      exitoDiv.style.display = "block";
      exitoDiv.innerText = "✅ ¡Contraseña actualizada con éxito! Ya podés ingresar con tu nueva contraseña.";
      if (params.get("mail")) {
        document.getElementById("mail").value = params.get("mail");
      }
    }
  </script>
</body>
</html>
