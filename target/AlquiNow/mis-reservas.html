<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mis Reservas — AlquiNow</title>
        <link rel="stylesheet" href="css/estilos.css">
    </head>
    <body>

        <header class="nav">
            <div class="logo"><a href="index.html" style="text-decoration:none;color:inherit;">Alqui<span>Now</span></a></div>
            <nav class="nav-links"></nav>
        </header>

        <main class="contenedor" style="max-width:800px;">
            <h1 style="margin-bottom:.3rem;">Mis Reservas</h1>
            <p style="color:var(--gris);">Historial de tus viajes y estadías confirmadas.</p>

            <div id="contenedor-reservas" style="margin-top: 2rem; display: grid; gap: 1.5rem;">
                <p>Cargando tus reservas...</p>
            </div>
        </main>

        <script src="js/session.js"></script>

        <!-- CARTELES VISUALES -->
        <div id="cartelExito" style="display: none; position: fixed; bottom: 20px; right: 20px; background-color: #4CAF50; color: white; padding: 15px 25px; border-radius: 5px; box-shadow: 0px 4px 6px rgba(0,0,0,0.2); z-index: 1000; font-family: sans-serif; font-weight: bold;">
            ✅ Acción completada con éxito
        </div>

        <div id="cartelError" style="display: none; position: fixed; bottom: 20px; right: 20px; background-color: #f44336; color: white; padding: 15px 25px; border-radius: 5px; box-shadow: 0px 4px 6px rgba(0,0,0,0.2); z-index: 1000; font-family: sans-serif; font-weight: bold;">
            <span id="textoError"></span>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                cargarReservas();
            });

            function cargarReservas() {
                fetch('reservas')
                .then(response => {
                    if (!response.ok) throw new Error("No autorizado o error del servidor");
                    return response.json();
                })
                .then(data => {
                    const contenedor = document.getElementById("contenedor-reservas");
                    if (data.length === 0) {
                        contenedor.innerHTML = '<div class="alerta">Aún no tenés reservas confirmadas. ¡Buscá tu próximo destino!</div>';
                        return;
                    }

                    contenedor.innerHTML = '';
                    
                    data.forEach(reserva => {
                        const tarjeta = document.createElement('div');
                        tarjeta.style.border = "1px solid #ddd";
                        tarjeta.style.padding = "1.5rem";
                        tarjeta.style.borderRadius = "8px";
                        tarjeta.style.backgroundColor = "#fff";
                        
                        let estadoLimpio = reserva.estado;
                        let colorBadge = "#777";

                        if (reserva.estado === 'pendiente_sena') {
                            estadoLimpio = 'Pendiente de seña';
                            colorBadge = "#f0ad4e";
                        } else if (reserva.estado === 'verificando_pago') {
                            estadoLimpio = 'Verificando pago (Transferencia)';
                            colorBadge = "#17a2b8";
                        } else if (reserva.estado === 'sena_pagada') {
                            estadoLimpio = 'Confirmada (Seña pagada)';
                            colorBadge = "#28a745";
                        } else if (reserva.estado === 'cancelada') {
                            estadoLimpio = 'Cancelada (Sin cargo)';
                            colorBadge = "#dc3545";
                            tarjeta.style.opacity = "0.7";
                        } else if (reserva.estado === 'cancelada_reembolsada') {
                            estadoLimpio = 'Cancelada con Reembolso';
                            colorBadge = "#dc3545";
                            tarjeta.style.opacity = "0.7";
                        } else if (reserva.estado === 'cancelada_penalizada') {
                            estadoLimpio = 'Cancelada (Penalidad aplicada)';
                            colorBadge = "#dc3545";
                            tarjeta.style.opacity = "0.7";
                        } else if (reserva.estado === 'finalizada') {
                            estadoLimpio = 'Finalizada';
                            colorBadge = "#007bff";
                        }

                        let limiteCorto = reserva.fechaLimitePago ? reserva.fechaLimitePago.substring(0, 16) : '';
                        
                        let alertaSena = "";
                        let botonPagar = "";
                        let infoMetodo = reserva.metodoPago ? ` | <strong>Método:</strong> ${reserva.metodoPago}` : "";

                        // Si está pendiente y eligió Transferencia, mostramos botón para subir ticket
                        if (reserva.estado === 'pendiente_sena') {
                            alertaSena = `<p style="color: #d9534f; font-weight: bold; margin-bottom: 5px; margin-top: 15px;">
                                          ⚠️ Límite para pagar: ${limiteCorto}
                                          </p>`;
                                          
                            if (reserva.metodoPago === 'Transferencia') {
                                botonPagar = `<button onclick="abrirModalPago(${reserva.id || reserva.idReserva})" style="background-color: #f0ad4e; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; font-weight: bold;">
                                                Subir comprobante
                                              </button>`;
                            }
                        }

                        let botonCancelar = "";
                        if (reserva.estado === 'pendiente_sena' || reserva.estado === 'sena_pagada' || reserva.estado === 'verificando_pago') {
                            botonCancelar = `<button onclick="ejecutarCancelacion(${reserva.id || reserva.idReserva})" style="background-color: #dc3545; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px; margin-left: 10px; font-weight: bold;">
                                              Cancelar Reserva
                                             </button>`;
                        }

                        let botonResena = "";
                        if (reserva.fechaFinal && reserva.estado === 'finalizada') {
                            const hoy = new Date();
                            const fechaFin = new Date(reserva.fechaFinal);
                            const milisegundosPorDia = 1000 * 60 * 60 * 24;
                            const diferenciaDias = Math.floor((hoy - fechaFin) / milisegundosPorDia);
                            
                            if (diferenciaDias >= 0 && diferenciaDias <= 60) {
                                botonResena = `<button onclick="abrirModalResena(${reserva.id || reserva.idReserva}, ${reserva.idPropiedad || reserva.idPropiedadFk})" style="background-color: #4CAF50; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                                                ⭐ Dejar Reseña
                                               </button>`;
                            }
                        }

                        tarjeta.innerHTML = `
                            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                <h3 style="margin-top: 0; color: #333;">Detalles de la estadía</h3>
                                ${botonResena}
                            </div>
                            
                            <p style="margin-bottom: 0.5rem;">
                                <strong>Propiedad:</strong> ${reserva.calle} ${reserva.altura}, ${reserva.ciudad}
                            </p>
                            
                            <p style="margin-bottom: 0.2rem;"><strong>Desde:</strong> ${reserva.fechaInicio}</p>
                            <p style="margin-bottom: 0.5rem;"><strong>Hasta:</strong> ${reserva.fechaFinal}</p>
                            
                            <p style="margin-bottom: 0.5rem;"><strong>Estado:</strong> <span style="background-color: ${colorBadge}; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold;">${estadoLimpio}</span></p>
                            <p style="color: #e55e30; font-weight: bold; margin: 0;">
                                Monto total: $${reserva.montoTotal} <span style="color: #666; font-size: 0.85rem; font-weight: normal;">${infoMetodo}</span>
                            </p>
                            
                            ${alertaSena}
                            <div style="display: flex; gap: 10px; margin-top: 10px;">
                                ${botonPagar}
                                ${botonCancelar}
                            </div>
                        `;

                        contenedor.appendChild(tarjeta);
                    });
                })
                .catch(error => {
                    document.getElementById("contenedor-reservas").innerHTML =
                        '<div class="alerta alerta-error">Error al cargar las reservas. Asegurate de haber iniciado sesión.</div>';
                    console.error(error);
                });
            }

            function ejecutarCancelacion(idReserva) {
                if (!confirm("¿Estás seguro de que querés cancelar esta reserva?\nSe aplicarán las políticas de reembolso correspondientes.")) return;

                const datos = new URLSearchParams();
                datos.append("accion", "cancelar");
                datos.append("id", idReserva);

                fetch('reservas', {
                    method: 'POST',
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: datos.toString()
                })
                .then(r => r.json())
                .then(data => {
                    if (data.ok) {
                        mostrarExito("✅ Reserva cancelada");
                        cargarReservas(); 
                    } else {
                        mostrarError(data.error || "No se pudo cancelar la reserva.");
                    }
                })
                .catch(error => mostrarError("Ocurrió un problema de conexión."));
            }

            // --- NUEVAS FUNCIONES PARA SUBIR EL TICKET ---
            function abrirModalPago(idReserva) {
                document.getElementById("pago-id-reserva").value = idReserva;
                document.getElementById("modal-pago").style.display = "flex";
            }

            function cerrarModalPago() {
                document.getElementById("modal-pago").style.display = "none";
                document.getElementById("form-pago").reset(); 
            }

            function enviarComprobante(evento) {
                evento.preventDefault(); 
                
                const formulario = document.getElementById("form-pago");
                const datos = new FormData(formulario);
                datos.append("accion", "subir_comprobante");

                // Ponemos cartelito de espera por si la foto pesa mucho
                document.getElementById("btn-subir-pago").innerText = "Enviando...";
                document.getElementById("btn-subir-pago").disabled = true;

                fetch('reservas', {
                    method: 'POST',
                    body: datos // NO le ponemos headers porque FormData los arma automáticamente para archivos
                })
                .then(r => r.json())
                .then(data => {
                    if (data.ok) {
                        mostrarExito("✅ Comprobante enviado para revisión.");
                        cerrarModalPago();
                        cargarReservas(); 
                    } else {
                        mostrarError(data.error || "No se pudo enviar el comprobante.");
                    }
                })
                .catch(error => mostrarError("Ocurrió un problema al subir la imagen."))
                .finally(() => {
                    document.getElementById("btn-subir-pago").innerText = "Enviar comprobante";
                    document.getElementById("btn-subir-pago").disabled = false;
                });
            }

            // --- FUNCIONES DE RESEÑAS ---
            function abrirModalResena(idReserva, idPropiedad) {
                document.getElementById("resena-id-reserva").value = idReserva;
                document.getElementById("resena-id-propiedad").value = idPropiedad;
                document.getElementById("modal-resena").style.display = "flex";
            }

            function cerrarModalResena() {
                document.getElementById("modal-resena").style.display = "none";
                document.getElementById("form-resena").reset(); 
            }

            function enviarResena(evento) {
                evento.preventDefault(); 
                
                const formulario = document.getElementById("form-resena");
                const datos = new URLSearchParams(new FormData(formulario));
                
                fetch('resenas', {
                    method: 'POST',
                    body: datos
                })
                .then(r => r.json())
                .then(data => {
                    if (data.ok) {
                        mostrarExito("✅ ¡Reseña publicada con éxito!");
                        cerrarModalResena();
                    } else {
                        mostrarError(data.error);
                        cerrarModalResena(); 
                    }
                })
                .catch(error => {
                    mostrarError("Ocurrió un problema de conexión.");
                    cerrarModalResena();
                });
            }

            function mostrarExito(mensaje) {
                const cartel = document.getElementById("cartelExito");
                cartel.innerHTML = mensaje;
                cartel.style.display = "block"; 
                setTimeout(() => cartel.style.display = "none", 3000);
            }

            function mostrarError(mensaje) {
                const cartelError = document.getElementById("cartelError");
                document.getElementById("textoError").innerText = "❌ " + mensaje;
                cartelError.style.display = "block";
                setTimeout(() => cartelError.style.display = "none", 4000);
            }
        </script>

        <!-- MODAL: Subir comprobante de pago -->
        <div id="modal-pago" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
            <div style="background: white; padding: 2rem; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <h3 style="margin-top: 0; color: #333;">Confirmar Transferencia</h3>
                <p style="color: #666; font-size: 0.9rem; margin-bottom: 1.5rem;">Adjuntá la captura de pantalla o PDF del ticket del banco para que el propietario pueda verificarlo.</p>

                <form id="form-pago" onsubmit="enviarComprobante(event)" enctype="multipart/form-data">
                    <input type="hidden" id="pago-id-reserva" name="id">

                    <div style="margin-bottom: 1.5rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Foto del ticket</label>
                        <input type="file" name="comprobante" accept="image/*, application/pdf" required style="width: 100%;">
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 10px;">
                        <button type="button" onclick="cerrarModalPago()" style="background: #ccc; color: #333; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Cancelar</button>
                        <button type="submit" id="btn-subir-pago" style="background: #e55e30; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">Enviar comprobante</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- MODAL: Dejar reseña -->
        <div id="modal-resena" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
            <div style="background: white; padding: 2rem; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <h3 style="margin-top: 0;">Calificá tu estadía</h3>

                <form id="form-resena" onsubmit="enviarResena(event)">
                    <input type="hidden" id="resena-id-reserva" name="idReserva">
                    <input type="hidden" id="resena-id-propiedad" name="idPropiedad">

                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Puntuación</label>
                        <select id="resena-calificacion" name="calificacion" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;" required>
                            <option value="">Elegí una opción...</option>
                            <option value="5">⭐⭐⭐⭐⭐ (Excelente)</option>
                            <option value="4">⭐⭐⭐⭐ (Muy bueno)</option>
                            <option value="3">⭐⭐⭐ (Bueno)</option>
                            <option value="2">⭐⭐ (Regular)</option>
                            <option value="1">⭐ (Malo)</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Comentario</label>
                        <textarea id="resena-comentario" name="comentario" rows="4" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; resize: vertical;" placeholder="¿Cómo fue tu experiencia?" required></textarea>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 10px;">
                        <button type="button" onclick="cerrarModalResena()" style="background: #ccc; color: #333; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Cancelar</button>
                        <button type="submit" style="background: #e55e30; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">Publicar</button>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
